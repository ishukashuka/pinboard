name: Release Build & Distribution

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish draft release on GitHub'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    name: Run Unit Tests & Frontend Build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Run Cargo Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Frontend Typecheck & Build
        run: npm run build

  build-linux:
    name: Build Linux x86_64 (AppImage & deb)
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies & tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev squashfs-tools

      - name: Install npm dependencies
        run: npm ci

      - name: Build Linux Bundles (AppImage and deb)
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npx tauri build --bundles appimage,deb

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pinboard-linux-x86_64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  build-windows:
    name: Build Windows x64 (NSIS Installer & Portable)
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows NSIS Installer
        run: npx tauri build --bundles nsis

      - name: Prepare Standalone Portable Executable
        shell: bash
        run: |
          mkdir -p src-tauri/target/release/bundle/portable
          cp src-tauri/target/release/pinboard.exe src-tauri/target/release/bundle/portable/Pinboard_0.2.4_x64-portable.exe

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pinboard-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/portable/*.exe
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Draft Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts for release upload
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.exe" \) -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Create GitHub Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          name: Pinboard v0.2.4
          body: |
            ## Pinboard v0.2.4 Release

            ### Cross-Platform Packages:
            - **Linux AppImage:** `Pinboard_0.2.4_amd64.AppImage` (portable x86_64, executable on Arch, Ubuntu, Fedora, Debian)
            - **Linux Debian Package:** `pinboard_0.2.4_amd64.deb` (native Debian/Ubuntu package)
            - **Windows NSIS Setup:** `Pinboard_0.2.4_x64-setup.exe` (per-user installer with auto-bootstrapper for WebView2)
            - **Windows Portable:** `Pinboard_0.2.4_x64-portable.exe` (standalone executable)

            ### Highlights:
            - Infinite scratchboard canvas (PureRef spatial freedom + Excalidraw interactions)
            - CodeMirror 6 with Vim keybindings & Markdown view/edit toggle
            - Native clipboard integration (bidirectional text, images, URLs)
            - SQLite local persistence and asset management
            - Built-in math expression evaluator and search-to-focus
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
